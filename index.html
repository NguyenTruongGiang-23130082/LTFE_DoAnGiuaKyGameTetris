<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tetris</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #e0e4e8;
            font-family: Arial, sans-serif;
        }
        .game {
            display: flex;
            gap: 25px;
            padding: 20px;
            background: #2b2b2b;
            color: white;
        }
        .sidebar {
            width: 170px;
        }
        .sidebar h1 {
            color: #ffcc00;
        }
        button {
            display: block;
            width: 100%;
            margin: 10px 0;
            padding: 10px;
            border: none;
            cursor: pointer;
            background: #00c9a7;
            font-weight: bold;
        }
        .board {
            position: relative;
        }
        #game {
            border-collapse: collapse;
            background: #080808;
        }
        .cell {
            width: 30px;
            height: 30px;
            padding: 0;
            border: 1px solid #292929;
        }
        .I {
            background: #00c9e8;
        }
        .J {
            background: #3478f6;
        }
        .L {
            background: #f39c12;
        }
        .O {
            background: #f1c40f;
        }
        .T {
            background: #9b59b6;
        }
        .S {
            background: #2ecc71;
        }
        .Z {
            background: #e74c3c;
        }
        .overlay {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 15px;
            background: rgba(0, 0, 0, 0.93);
            text-align: center;
        }
        .overlay button {
            max-width: 190px;
        }
        .level-choices {
            display: grid;
            grid-template-columns: repeat(4, 50px);
            gap: 10px;
            justify-content: center;
        }
        .level-choices button {
            width: 50px;
            height: 50px;
            margin: 0;
            padding: 0;
        }
        [hidden] {
            display: none !important;
        }
        .obstacle {
            background: #555 !important;
            border: 2px solid #ff4444;
        }
        .wind-message {
            position: absolute;
            top: 8px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 3;
            color: #8be9fd;
            font-size: 14px;
            font-weight: bold;
            white-space: nowrap;
            pointer-events: none;
        }
        .fog-effect {
            position: absolute;
            inset: 0;
            background: #111;
            display: none;
            z-index: 2;
            pointer-events: none;
        }
        .cell.frozen-zone {
            background-image: linear-gradient(rgba(80, 190, 255, 0.25), rgba(80, 190, 255, 0.25));
            box-shadow: inset 0 0 0 1px #65cfff;
        }
        .cell.frozen-block {
            background-image: linear-gradient(rgba(175, 230, 255, 0.55), rgba(175, 230, 255, 0.55));
            box-shadow: inset 0 0 0 3px #c6f3ff;
        }
        .cell.portal-a, .cell.portal-b {
            position: relative;
            box-shadow: inset 0 0 0 3px #31a8ff;
        }
        .cell.portal-b {
            box-shadow: inset 0 0 0 3px #fc9b40;
        }
        .cell.portal-a::after, .cell.portal-b::after {
            position: absolute;
            inset: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 13px;
            font-weight: bold;
            color: white;
            text-shadow: 0 1px 2px black;
            pointer-events: none;
        }
        .cell.portal-a::after {
            content: "A";
        }
        .cell.portal-b::after {
            content: "B";
        }
        .overlay h2 {
            margin: 0 0 8px;
            font-size: 22px;
            line-height: 1.3;
        }
        .level-intro {
            width: 100%;
            max-width: 240px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
        }
        .level-intro p {
            margin: 0;
            color: #e2e2e2;
            font-size: 15px;
            line-height: 1.5;
        }
        .level-intro button {
            max-width: 180px;
            margin: 4px 0 0;
            border-radius: 6px;
        }
        .overlay #choose {
            background: #424242;
            color: white;
            border-radius: 6px;
        }
    </style>
</head>
<body>
<div class="game">
    <div class="sidebar">
        <h1>TETRIS</h1>
        <p>Điểm: <span id="score">0</span></p>
        <p>Cấp độ: <span id="level">1</span></p>
        <p>Số hàng: <span id="lines">0</span> / 10</p>
        <p id="level6TimeBox" hidden>
            Thời gian: <span id="level6Time">03:00</span>
        </p>
        <button id="start">Bắt đầu</button>
        <button id="pause">Tạm dừng</button>
        <p>← → : Di chuyển</p>
        <p>↑ : Xoay khối</p>
        <p>↓ : Rơi nhanh</p>
    </div>
    <div class="board">
        <div id="fogEffect" class="fog-effect"></div>
        <table id="game"></table>
        <div id="windMessage" class="wind-message"></div>
        <div id="overlay" class="overlay">
            <h2 id="message">TETRIS</h2>
            <div id="levelIntro" class="level-intro" hidden>
                <p id="levelDescription"></p>
                <button id="playLevel">Bắt đầu chơi</button>
            </div>
            <div id="levelChoices" class="level-choices"></div>
            <button id="next" hidden>Màn tiếp theo</button>
            <button id="replay" hidden>Chơi lại màn này</button>
            <button id="choose" hidden>Chọn màn</button>
        </div>
    </div>
</div>
<script src="game.js"></script>
</body>
</html>
